name: CI

# RULES §12 第 ⑧ 步：合并前 checklist 里「测试绿」由这里兜住，PR 不绿不许合
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      # 格式先跑：它最快，失败时不用等编译
      - name: 代码风格（ktlint）
        run: ./gradlew ktlintCheck

      # AGP 给每个 Android 模块建的 test 任务会带上所有变体的单测；
      # core:model / core:version 是纯 Kotlin 模块，靠同一个 test 任务名一起跑
      - name: 单元测试
        run: ./gradlew test

      - name: 构建 Debug 包
        run: ./gradlew :app:assembleDebug

      # 产物留档：出问题时要能拿到那一次 CI 打出来的包，而不是本地重新拼一个
      - name: 上传 Debug 包
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
