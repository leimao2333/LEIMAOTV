name: Release

# 发版只认 tag（RULES §10.3 第 4 项）：tag 打上去，包就自己出来并挂到 Release 上。
# 不接受手动 workflow_dispatch —— 手动触发会让人绕过「tag 与版本号必须一致」这道闸。
on:
  push:
    tags:
      # GitHub 的 tag 过滤是 glob 不是正则，`[0-9]+` 在这儿只会匹配一个字符加一个字面量 +
      # 所以这里只做粗筛（文档用的 topic-* 之类不触发），四段式的严格校验在「校验产物」那步
      - 'v[0-9]*'

# 建 Release、传附件要写权限；其余一律只读
permissions:
  contents: write

# 同一个 tag 不并发：两次同时跑会互相覆盖附件
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 要读 tag 的注解当 Release 正文，浅克隆拿不到
          fetch-depth: 0

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      # 密钥就在仓库里（发版不需要配任何 secret），但这不代表可以不检查：
      # 少一个文件或密码对不上，会一路走到 assembleRelease 才炸，日志里只有一句
      # "Failed to read key"，看不出到底哪儿缺了
      - name: 确认签名材料
        run: |
          set -euo pipefail

          if [ ! -f keystore.properties ]; then
            echo "::error::仓库里没有 keystore.properties，签不出包。"
            echo "::error::用 scripts/create-keystore.sh 生成密钥与配置，两者都要提交。"
            exit 1
          fi

          STORE=$(sed -n 's/^storeFile=//p' keystore.properties)
          PASS=$(sed -n 's/^storePassword=//p' keystore.properties)
          ALIAS=$(sed -n 's/^keyAlias=//p' keystore.properties)

          for pair in "storeFile:$STORE" "storePassword:$PASS" "keyAlias:$ALIAS"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::keystore.properties 里缺 ${pair%%:*}。"
              exit 1
            fi
          done

          if [ ! -f "$STORE" ]; then
            echo "::error::keystore.properties 指向的密钥不存在：$STORE。"
            echo "::error::密钥文件必须随仓库提交，否则 CI 签不出来。"
            exit 1
          fi

          if ! keytool -list -keystore "$STORE" -alias "$ALIAS" -storepass "$PASS" >/dev/null; then
            echo "::error::密钥读不出来：别名或密码与 keystore.properties 对不上。原始报错如下："
            keytool -list -keystore "$STORE" -alias "$ALIAS" -storepass "$PASS" || true
            exit 1
          fi
          echo "签名材料就绪（随仓库的密钥，别名 $ALIAS）"

      # RULES §10.4 第 1 条：测试不绿不发版。格式先跑（最快，失败时不用等编译）
      - name: 代码风格（ktlint）
        run: ./gradlew ktlintCheck

      - name: 单元测试
        run: ./gradlew test

      - name: 构建 Release 包
        run: ./gradlew :app:assembleRelease

      # 一个 job 里把「版本号对不对、包签没签、名字对不对」一次验完再上传，
      # 中间任何一步不达标都直接失败，Release 上一个附件都不会多出来
      - name: 校验产物并按 RULES §10.4 命名
        id: verify
        run: |
          set -euo pipefail

          META=app/build/outputs/apk/release/output-metadata.json
          if [ ! -f "$META" ]; then
            echo "::error::没找到 $META，assembleRelease 没产出可发布的包。"
            exit 1
          fi

          VERSION=$(jq -r '.elements[0].versionName' "$META")
          CODE=$(jq -r '.elements[0].versionCode' "$META")

          # tag 与 versionName 对不上，说明打包用的代码不是这个 tag 该有的版本
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag 是 $GITHUB_REF_NAME，包里的 versionName 是 $VERSION。"
            echo "::error::版本号四处同步（RULES §10.3）没做全，先改对再重新打 tag。"
            exit 1
          fi

          # tag 的粗筛留了 v[0-9]*，这里补严格校验：不是四段数字就没法套 §10.2 的公式
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versionName 是 $VERSION，不是四段式（RULES §10.2）。"
            exit 1
          fi

          # 公式见 RULES §10.2：顶×1000000 + 大×10000 + 小×100 + 修
          IFS=. read -r top major minor patch <<< "$VERSION"
          EXPECT_CODE=$((top * 1000000 + major * 10000 + minor * 100 + patch))
          if [ "$CODE" != "$EXPECT_CODE" ]; then
            echo "::error::versionCode 是 $CODE，按 §10.2 公式应为 $EXPECT_CODE。"
            exit 1
          fi

          # RULES §10.3 第 3 项：CHANGELOG.md 必须先有这个版本的条目
          if ! grep -q "^## v$VERSION" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里没有 v$VERSION 的条目（见 RULES §10.3 第 3 项）。"
            exit 1
          fi

          # 现在只有一个包（没有 native so，三份拆包内容完全一样）。真做了 ABI 拆包
          # 就得在这里补「哪个包叫什么名」的映射，否则宁可直接失败也别传一个错名字
          count=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::release 目录里有 $count 个 APK，命名规则还没为拆包做准备（RULES §10.4 第 6 条）。"
            find app/build/outputs/apk/release -maxdepth 1 -name '*.apk'
            exit 1
          fi
          SRC=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk')

          # 名字必须与 core:model 里 ApkAssets 的定义逐字一致（应用内更新器按名精确匹配）。
          #
          # 为什么叫 -universal 而不是主名：现在一个 native so 都没有，这一份包在 32 位与 64 位
          # 盒子上都能装，它**就是** universal 包。叫主名（arm64）的话，ApkAssets.pick 对 32 位
          # 设备只认 v7a / universal，那些盒子会永远收不到更新 —— 而包明明是能装的。
          # 等接入 libVLC 真做了 ABI 拆包，再把 arm64 那份叫主名，pick 的选择顺序不用改。
          APK="leimao-tv-v$VERSION-universal.apk"
          cp "$SRC" "$APK"

          # 托管 runner 上两个变量都在；取不到时明确报错，别让 find 对着空路径瞎找
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::ANDROID_HOME / ANDROID_SDK_ROOT 都没设，找不到 apksigner。"
            exit 1
          fi
          BUILD_TOOLS=$(find "$SDK/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -1)

          # RULES §10.4 第 4 条：v2 签名必须为 true
          # -v 不能省：不带它 apksigner 只打印证书，不打印 "Verified using vN scheme" 那几行，
          # 下面那句 grep 会永远失败（而且看起来像「包没签上」）
          SIG=$("$BUILD_TOOLS/apksigner" verify -v --print-certs "$APK" 2>&1) || {
            echo "::error::apksigner 校验失败，包没签上："
            echo "$SIG"
            exit 1
          }
          # apksigner 会对每个没被签名保护的 META-INF 条目报一条 WARNING，一次八十多行，
          # 真正要看的只有下面这几行
          grep -E 'Verified using|Number of signers|Signer #1 certificate DN' <<< "$SIG" || true
          if ! grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$SIG"; then
            echo "::error::v2 签名不是 true，按 RULES §10.4 第 4 条不能发。"
            exit 1
          fi

          # 包名兜底：万一哪天 configuration 出错编出了别的 applicationId，
          # 至少别把它当作正式包发出去
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK" | head -1)
          echo "$BADGING"
          if ! grep -q "package: name='com.leimao.tv'" <<< "$BADGING"; then
            echo "::error::包名不是 com.leimao.tv。"
            exit 1
          fi

          sha256sum "$APK" > "$APK.sha256"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          ls -l "$APK"

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.verify.outputs.version }}
          APK: ${{ steps.verify.outputs.apk }}
        run: |
          set -euo pipefail

          # tag 的注解就是 Release 正文（RULES §10.3 的「三段日志」分工：这里写给下载的人看）
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          if [ -z "$NOTES" ]; then
            echo "::warning::tag 没有注解，Release 正文改用 GitHub 自动生成。下次用 git tag -a 打。"
          fi

          # 重跑时释放已存在：改成覆盖附件，而不是报 "release already exists" 就停在那儿，
          # 让人去手工点上传（最容易传错文件的一步）
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release 已存在，覆盖附件"
            gh release upload "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --clobber
          else
            if [ -n "$NOTES" ]; then
              gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
                --title "LEIMAOTV v$VERSION" --notes "$NOTES" --verify-tag
            else
              gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
                --title "LEIMAOTV v$VERSION" --generate-notes --verify-tag
            fi
          fi
