name: Release

# 发版只认 tag（RULES §10.3 第 4 项）：tag 打上去，包就自己出来并挂到 Release 上。
# 不接受手动 workflow_dispatch —— 手动触发会让人绕过「tag 与版本号必须一致」这道闸。
on:
  push:
    tags:
      # GitHub 的 tag 过滤是 glob 不是正则，`[0-9]+` 在这儿只会匹配一个字符加一个字面量 +
      # 所以这里只做粗筛（文档用的 topic-* 之类不触发），四段式的严格校验在「校验产物」那步
      - 'v[0-9]*'

# 建 Release、传附件要写权限；其余一律只读
permissions:
  contents: write

# 同一个 tag 不并发：两次同时跑会互相覆盖附件
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 要读 tag 的注解当 Release 正文，浅克隆拿不到
          fetch-depth: 0

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      # 密钥就在仓库里（发版不需要配任何 secret），但这不代表可以不检查：
      # 少一个文件或密码对不上，会一路走到 assembleRelease 才炸，日志里只有一句
      # "Failed to read key"，看不出到底哪儿缺了
      - name: 确认签名材料
        run: |
          set -euo pipefail

          if [ ! -f keystore.properties ]; then
            echo "::error::仓库里没有 keystore.properties，签不出包。"
            echo "::error::用 scripts/create-keystore.sh 生成密钥与配置，两者都要提交。"
            exit 1
          fi

          STORE=$(sed -n 's/^storeFile=//p' keystore.properties)
          PASS=$(sed -n 's/^storePassword=//p' keystore.properties)
          ALIAS=$(sed -n 's/^keyAlias=//p' keystore.properties)

          for pair in "storeFile:$STORE" "storePassword:$PASS" "keyAlias:$ALIAS"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::keystore.properties 里缺 ${pair%%:*}。"
              exit 1
            fi
          done

          if [ ! -f "$STORE" ]; then
            echo "::error::keystore.properties 指向的密钥不存在：$STORE。"
            echo "::error::密钥文件必须随仓库提交，否则 CI 签不出来。"
            exit 1
          fi

          if ! keytool -list -keystore "$STORE" -alias "$ALIAS" -storepass "$PASS" >/dev/null; then
            echo "::error::密钥读不出来：别名或密码与 keystore.properties 对不上。原始报错如下："
            keytool -list -keystore "$STORE" -alias "$ALIAS" -storepass "$PASS" || true
            exit 1
          fi
          echo "签名材料就绪（随仓库的密钥，别名 $ALIAS）"

      # RULES §10.4 第 1 条：测试不绿不发版。格式先跑（最快，失败时不用等编译）
      - name: 代码风格（ktlint）
        run: ./gradlew ktlintCheck

      - name: 单元测试
        run: ./gradlew test

      - name: 构建 Release 包
        run: ./gradlew :app:assembleRelease

      # 一个 job 里把「版本号对不对、包签没签、名字对不对」一次验完再上传，
      # 中间任何一步不达标都直接失败，Release 上一个附件都不会多出来
      - name: 校验产物并按 RULES §10.4 命名
        id: verify
        run: |
          set -euo pipefail

          META=app/build/outputs/apk/release/output-metadata.json
          if [ ! -f "$META" ]; then
            echo "::error::没找到 $META，assembleRelease 没产出可发布的包。"
            exit 1
          fi

          VERSION=$(jq -r '.elements[0].versionName' "$META")
          CODE=$(jq -r '.elements[0].versionCode' "$META")

          # tag 与 versionName 对不上，说明打包用的代码不是这个 tag 该有的版本
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag 是 $GITHUB_REF_NAME，包里的 versionName 是 $VERSION。"
            echo "::error::版本号四处同步（RULES §10.3）没做全，先改对再重新打 tag。"
            exit 1
          fi

          # tag 的粗筛留了 v[0-9]*，这里补严格校验：不是四段数字就没法套 §10.2 的公式
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versionName 是 $VERSION，不是四段式（RULES §10.2）。"
            exit 1
          fi

          # 公式见 RULES §10.2：顶×1000000 + 大×10000 + 小×100 + 修
          IFS=. read -r top major minor patch <<< "$VERSION"
          EXPECT_CODE=$((top * 1000000 + major * 10000 + minor * 100 + patch))
          if [ "$CODE" != "$EXPECT_CODE" ]; then
            echo "::error::versionCode 是 $CODE，按 §10.2 公式应为 $EXPECT_CODE。"
            exit 1
          fi

          # RULES §10.3 第 3 项：CHANGELOG.md 必须先有这个版本的条目
          if ! grep -q "^## v$VERSION" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里没有 v$VERSION 的条目（见 RULES §10.3 第 3 项）。"
            exit 1
          fi

          # ABI 拆包（PLAY-02）：接入 libVLC 后产出三份，各带各架构的 native so。
          # 名字在 app/build.gradle.kts 里已经改成 leimao-tv-v<版本>[-v7a|-universal].apk，
          # 与 core:model 里 ApkAssets 的定义逐字一致（应用内更新器按名精确匹配）。
          # arm64 那份叫主名，v7a 与 universal 是它的两个变体（RULES §10.4 第 6 条）。
          count=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "::error::release 目录里有 $count 个 APK，应为 3 个（arm64 / v7a / universal）。"
            find app/build/outputs/apk/release -maxdepth 1 -name '*.apk'
            exit 1
          fi

          ARM64="leimao-tv-v$VERSION.apk"
          V7A="leimao-tv-v$VERSION-v7a.apk"
          UNIVERSAL="leimao-tv-v$VERSION-universal.apk"
          for name in "$ARM64" "$V7A" "$UNIVERSAL"; do
            if [ ! -f "app/build/outputs/apk/release/$name" ]; then
              echo "::error::缺 $name，拆包命名与 RULES §10.4 第 6 条不符。"
              ls -l app/build/outputs/apk/release/
              exit 1
            fi
          done
          cp "app/build/outputs/apk/release/$ARM64" "$ARM64"
          cp "app/build/outputs/apk/release/$V7A" "$V7A"
          cp "app/build/outputs/apk/release/$UNIVERSAL" "$UNIVERSAL"

          # 托管 runner 上两个变量都在；取不到时明确报错，别让 find 对着空路径瞎找
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::ANDROID_HOME / ANDROID_SDK_ROOT 都没设，找不到 apksigner。"
            exit 1
          fi
          BUILD_TOOLS=$(find "$SDK/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -1)

          # RULES §10.4 第 4 条：v2 签名必须为 true。三个包都要验，任何一个没签上都不能发
          # -v 不能省：不带它 apksigner 只打印证书，不打印 "Verified using vN scheme" 那几行，
          # 下面那句 grep 会永远失败（而且看起来像「包没签上」）
          for APK in "$ARM64" "$V7A" "$UNIVERSAL"; do
            SIG=$("$BUILD_TOOLS/apksigner" verify -v --print-certs "$APK" 2>&1) || {
              echo "::error::apksigner 校验失败，$APK 没签上："
              echo "$SIG"
              exit 1
            }
            if ! grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$SIG"; then
              echo "::error::$APK 的 v2 签名不是 true，按 RULES §10.4 第 4 条不能发。"
              exit 1
            fi
            # 包名兜底：万一哪天 configuration 出错编出了别的 applicationId，
            # 至少别把它当作正式包发出去
            BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK" | head -1)
            if ! grep -q "package: name='com.leimao.tv'" <<< "$BADGING"; then
              echo "::error::$APK 的包名不是 com.leimao.tv。"
              exit 1
            fi
            echo "✅ $APK：v2 签名真、包名对"
          done

          for APK in "$ARM64" "$V7A" "$UNIVERSAL"; do
            sha256sum "$APK" > "$APK.sha256"
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arm64=$ARM64" >> "$GITHUB_OUTPUT"
          echo "v7a=$V7A" >> "$GITHUB_OUTPUT"
          echo "universal=$UNIVERSAL" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          ls -l "$ARM64" "$V7A" "$UNIVERSAL"

      - name: 发布到 GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.verify.outputs.version }}
          ARM64: ${{ steps.verify.outputs.arm64 }}
          V7A: ${{ steps.verify.outputs.v7a }}
          UNIVERSAL: ${{ steps.verify.outputs.universal }}
        run: |
          set -euo pipefail

          # tag 的注解就是 Release 正文（RULES §10.3 的「三段日志」分工：这里写给下载的人看）
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          if [ -z "$NOTES" ]; then
            echo "::warning::tag 没有注解，Release 正文改用 GitHub 自动生成。下次用 git tag -a 打。"
          fi

          # 三个拆包 + 三个 sha256，一次传完
          ASSETS=("$ARM64" "$ARM64.sha256" "$V7A" "$V7A.sha256" "$UNIVERSAL" "$UNIVERSAL.sha256")
          TAG="$GITHUB_REF_NAME"

          # 同名 Release 一律删掉重建，不去猜它是不是「还活着」：
          # 2026-11-06 连挂四次的根源就是 tag 被删过重建后留下一个脱钩的同名 Release，
          # `gh release view` 返回 0、upload 也报成功，可下载路径一直 404。
          # `gh release delete --yes` 不带 --cleanup-tag，只删 Release 对象、绝不动 tag。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "同名 Release 已存在，删掉重建（保留 tag）"
            gh release delete "$TAG" --yes
          fi

          # create 时直接带 6 个附件：这条路径在 v0.5.6.4 的 13:09 那次 run 里完整通过过。
          # 不要再拆成「建空 Release + 单独 upload」—— 拆开后 gh api 的 tags 端点在 tag
          # 刚重建时会短暂查不到，上传与自检跟着一起挂（11-07 补发第 10 步就是这么失败的）。
          if [ -n "$NOTES" ]; then
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "LEIMAOTV v$VERSION" --notes "$NOTES" --verify-tag
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "LEIMAOTV v$VERSION" --generate-notes --verify-tag
          fi

          # 后面一律按 release id 取附件，不用 releases/tags/<tag>：前者只看对象本身，
          # 后者要求 tag 与 Release 仍然关联，恰恰是这次要绕开的那个坑。
          JQ='.[] | select(.tag_name == "'"$TAG"'") | .id'
          RID=""
          for i in 1 2 3 4 5; do
            RID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "$JQ" 2>/dev/null || true)
            if [ -n "$RID" ]; then break; fi
            echo "Release 还没在 API 侧可见，等 3 秒（第 $i 次）"
            sleep 3
          done
          if [ -z "$RID" ]; then
            echo "::error::发布后查不到 Release 对象（tag=$TAG）。"
            exit 1
          fi
          echo "release_id=$RID" >> "$GITHUB_OUTPUT"

          # 按 id 自检附件清单：缺一个就停，不让下一步报一堆看不懂的 404
          LIST=""
          for i in 1 2 3 4 5 6; do
            LIST=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets?per_page=100" \
              --jq '.[].name' 2>/dev/null || true)
            if [ "$(grep -c . <<<"$LIST")" -ge 6 ]; then break; fi
            echo "附件清单还没齐（第 $i 次），等 3 秒"
            sleep 3
          done
          for A in "${ASSETS[@]}"; do
            if ! grep -qxF "$A" <<<"$LIST"; then
              echo "::error::Release 里缺附件 $A。当前清单："
              echo "$LIST"
              exit 1
            fi
          done
          echo "附件自检通过：6 个文件齐全"

      # RULES §10.4 第 7 条：发布后回下载一次，确认附件没被截断。
      # 比的是「CI 刚签出来的包」与「GitHub 存的那份附件」—— 本地产物与 CI 产物天然不等价
      # （实测 v0.2.9.8 相差 1046 字节，签名与大小都正常），拿本地包当基准只会永远对不上。
      #
      # 2026-11-06 的教训：下载必须走 asset API（按 asset id），不能拼
      # releases/download/<tag>/<name> 的 CDN 路径 —— tag 被删过重建时 CDN 会缓存旧的 404，
      # 附件明明在却一直下载失败。CDN 那条路径降级为「只观察、不判死」，因为它是用户实际
      # 点的入口，有传播延迟很正常，不该让整次发版判失败。
      - name: 回下载比对（防上传截断）
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.publish.outputs.release_id }}
          ARM64: ${{ steps.verify.outputs.arm64 }}
          V7A: ${{ steps.verify.outputs.v7a }}
          UNIVERSAL: ${{ steps.verify.outputs.universal }}
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"
          # 按 release id 列附件，不碰 releases/tags/<tag>（tag 脱钩时那个端点会 404）
          API="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100"

          # 刚上传完 assets 列表偶有秒级延迟，先等 6 个附件都在 API 侧可见
          LIST=""
          for i in 1 2 3 4 5 6; do
            LIST=$(gh api "$API" --jq '.[] | [.name, .url, (.size|tostring)] | @tsv' 2>/dev/null || true)
            if [ "$(grep -c . <<<"$LIST")" -ge 6 ]; then break; fi
            echo "附件清单还没齐（第 $i 次），等 5 秒"
            sleep 5
          done
          if [ "$(grep -c . <<<"$LIST")" -lt 6 ]; then
            echo "::error::Release 里只有 $(grep -c . <<<"$LIST") 个附件，应为 6 个。"
            gh api "$API" --jq '.[].name' || true
            exit 1
          fi

          # 三个包都要回下载对一遍：任何一个被截断都不能当没看见
          for APK in "$ARM64" "$V7A" "$UNIVERSAL"; do
            EXPECT=$(cut -d' ' -f1 "$APK.sha256")
            ASSET_URL=$(awk -F'\t' -v n="$APK" '$1==n {print $2}' <<<"$LIST")
            if [ -z "$ASSET_URL" ]; then
              echo "::error::Release 里没有 $APK 这个附件。"
              exit 1
            fi

            ACTUAL=""
            for i in 1 2 3 4; do
              if curl -sSfL --retry 2 --retry-delay 3 \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/octet-stream" \
                  -o /tmp/downloaded.apk "$ASSET_URL"; then
                ACTUAL=$(sha256sum /tmp/downloaded.apk | cut -d' ' -f1)
                if [ "$EXPECT" = "$ACTUAL" ]; then
                  echo "✅ 回下载比对通过（asset API）：$APK $EXPECT"
                  continue 2
                fi
              fi
              echo "第 $i 次没对上 $APK（期望 $EXPECT，实际 ${ACTUAL:-下载失败}），等 5 秒再试"
              sleep 5
            done

            echo "::error::$APK 上传后的附件与构建产物 sha256 不一致（期望 $EXPECT，实际 ${ACTUAL:-下载失败}）。"
            echo "::error::多半是上传被截断。别手动重传：查清原因后删 Release 重跑流水线。"
            exit 1
          done

          # 用户真正点的是 CDN 路径，单独观察一次；传播延迟只告警，不改发版结论
          for APK in "$ARM64" "$V7A" "$UNIVERSAL"; do
            EXPECT=$(cut -d' ' -f1 "$APK.sha256")
            URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK"
            if curl -sSfL --retry 1 -o /tmp/cdn.apk "$URL" 2>/dev/null; then
              CDN=$(sha256sum /tmp/cdn.apk | cut -d' ' -f1)
              if [ "$CDN" = "$EXPECT" ]; then
                echo "✅ CDN 下载路径也通过：$APK"
              else
                echo "::warning::CDN 上 $APK 还是旧内容（$CDN）；API 侧已校验通过，等 CDN 刷新即可"
              fi
            else
              echo "::warning::CDN 路径 $APK 暂不可达；asset API 已校验通过，不影响发版结论"
            fi
          done
